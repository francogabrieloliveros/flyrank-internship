services:
  api:
    build: .
    ports:
      - "3000:${PORT}"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      PORT: ${PORT}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_STUB: ${LLM_STUB}
    volumes:
      - .:/app:z
      - /app/node_modules
